name: Build articles from Word files

on:
  push:
    paths:
      - 'articles/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install converter
        run: npm install --no-save mammoth@1.8.0
      - name: Build js/data-docs.js
        run: node build-articles.js
      - name: Save result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data-docs.js
          git diff --cached --quiet || git commit -m "Update articles from Word files"
          git push
